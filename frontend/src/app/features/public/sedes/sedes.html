<section class="sedes-section py-5 bg-light">
  <div class="container">
    
    <!-- Encabezado -->
    <div class="row justify-content-center text-center mb-5 animate__animated animate__fadeInUp">
      <div class="col-lg-8">
        <span class="badge bg-success-subtle text-success mb-2 px-3 py-2 rounded-pill fw-bold text-uppercase">
          Cobertura Regional
        </span>
        <h1 class="display-5 fw-bolder text-dark mb-3">Nuestras Sedes</h1>
        <p class="lead text-secondary">
          Estamos más cerca de ti. Encuentra la sede del CEA Conductores La Unión que mejor se adapte a tu ubicación.
        </p>
      </div>
    </div>


    <!-- Grid de Tarjetas -->
    <div class="row g-4 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let sede of sedes">
        
        <!-- Aplicamos las clases personalizadas aquí -->
        <div class="card h-100 border-0 shadow-sm rounded-4 sede-card">
          
          <div class="sede-card__header rounded-top-4">
            <img
              class="sede-card__image"
              [src]="sede.imagen"
              [alt]="sede.alt"
              loading="lazy"
              decoding="async"
              fetchpriority="low"
              (error)="usarImagenFallback($event)"
            >
          </div>

          <div class="card-body p-4 text-center d-flex flex-column">
            <h3 class="h4 fw-bold text-dark mb-2">{{ sede.nombre }}</h3>
            <p class="text-secondary small mb-3">{{ sede.descripcion }}</p>
            
            <ul class="list-unstyled text-start mb-4 text-muted small">
              <li class="mb-2"><i class="bi bi-geo-alt-fill me-2" style="color: var(--color-lime);"></i>{{ sede.direccion }}</li>
              <li><i class="bi bi-telephone-fill me-2" style="color: var(--color-lime);"></i>{{ sede.telefono }}</li>
            </ul>

            <a [routerLink]="['/sedes', sede.id]" class="btn w-100 mt-auto rounded-pill sede-btn">
              Ver detalles <i class="bi bi-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
