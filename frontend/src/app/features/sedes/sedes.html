<section class="py-5 bg-light" style="min-height: 80vh;">
  <div class="container">
    
    <!-- Encabezado -->
    <div class="row justify-content-center text-center mb-5">
      <div class="col-lg-8">
        <span class="badge bg-success-subtle text-success mb-2 px-3 py-2 rounded-pill fw-bold text-uppercase">
          Cobertura Regional
        </span>
        <h1 class="display-5 fw-bolder text-dark mb-3">Nuestras Sedes</h1>
        <p class="lead text-secondary">
          Estamos más cerca de ti. Encuentra la sede del CEA Conductores La Unión que mejor se adapte a tu ubicación.
        </p>
      </div>
    </div>

    <!-- Grid de Tarjetas -->
    <div class="row g-4 justify-content-center">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let sede of sedes">
        <div class="card h-100 border-0 shadow-sm rounded-4 transition-hover">
          
          <!-- Cabecera visual de la tarjeta -->
          <div class="card-header bg-dark text-white text-center py-5 rounded-top-4 border-0 position-relative overflow-hidden">
            <!-- Forma decorativa de fondo -->
            <div class="position-absolute top-0 start-0 w-100 h-100" style="background: radial-gradient(circle at 80% 20%, rgba(165,195,0,0.3) 0%, transparent 60%);"></div>
            <i class="bi {{ sede.icono }} display-1 text-success position-relative z-1"></i>
          </div>

          <div class="card-body p-4 text-center d-flex flex-column">
            <h3 class="h4 fw-bold text-dark mb-2">{{ sede.nombre }}</h3>
            <p class="text-secondary small mb-3">{{ sede.descripcion }}</p>
            
            <ul class="list-unstyled text-start mb-4 text-muted small">
              <li class="mb-2"><i class="bi bi-geo-alt-fill text-success me-2"></i>{{ sede.direccion }}</li>
              <li><i class="bi bi-telephone-fill text-success me-2"></i>{{ sede.telefono }}</li>
            </ul>

            <a [routerLink]="['/sedes', sede.id]" class="btn btn-success w-100 mt-auto rounded-pill">
              Ver detalles <i class="bi bi-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
