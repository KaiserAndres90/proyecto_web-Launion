<main class="not-found-page bg-light min-vh-100 d-flex align-items-center justify-content-center">
  <section class="not-found-content text-center px-3 animate__animated animate__fadeInUp">
    <i
      class="not-found-icon bi bi-cone-striped"
      aria-hidden="true"
    ></i>

    <h1 class="not-found-code display-1 fw-bolder mb-2">404</h1>

    <h2 class="not-found-title h2 fw-bold mb-3">
      ¡Ups! Te has desviado de la ruta
    </h2>

    <p class="not-found-description lead text-secondary mb-4">
      La página que buscas no existe o ha sido movida. Vuelve al camino seguro.
    </p>

    <a
      routerLink="/"
      class="btn btn-success btn-lg not-found-button px-5 py-3 fw-semibold"
    >
      <i class="bi bi-house-door-fill me-2" aria-hidden="true"></i>
      Volver al Inicio
    </a>
  </section>
</main>
