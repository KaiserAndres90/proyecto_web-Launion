<aside class="sidebar d-flex flex-column h-100" [class.sidebar--collapsed]="collapsed" [attr.aria-label]="heading">
  <div class="sidebar__brand-row d-flex align-items-center justify-content-between mb-3">
    <a class="sidebar__brand d-flex align-items-center text-decoration-none" [routerLink]="homeRoute" aria-label="CEA Conductores La Unión, inicio">
      <img class="sidebar__brand-mark" src="/logo-cea.jpg" alt="" width="42" height="42">
      <span class="sidebar__brand-text ms-2">CEA <strong>La Unión</strong></span>
    </a>
    @if (collapseEnabled) {
      <button class="btn sidebar__collapse-btn" type="button" (click)="toggleRequested.emit()" [attr.aria-label]="collapsed ? 'Expandir menú lateral' : 'Colapsar menú lateral'">
        <i class="bi" [class.bi-chevron-left]="!collapsed" [class.bi-chevron-right]="collapsed" aria-hidden="true"></i>
      </button>
    }
  </div>

  <p class="sidebar__label px-2 mb-2">{{ heading }}</p>
  <nav class="sidebar__nav d-grid" [attr.aria-label]="'Secciones de ' + heading">
    @for (item of items; track item.route) {
      <a class="sidebar__link d-flex align-items-center"
         [routerLink]="item.route"
         routerLinkActive="sidebar__link--active"
         [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page"
         [title]="item.label">
        <i class="bi" [class]="item.icon" aria-hidden="true"></i><span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <button class="sidebar__exit mt-auto" type="button" (click)="logoutRequested.emit()">
    <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Cerrar sesión</span>
  </button>
</aside>
